# Fine-tune A of the released weight soup: 768 frames per question at the mezzanine
# resolution (the processor resizes each frame pair to <= 128 tokens).
regime: r768
model: Qwen/Qwen3.5-9B
global_batch_size: 64
per_device_train_batch_size: 1
learning_rate: 1.4e-4
num_train_epochs: 15
released_epoch: 4          # checkpoint that entered the soup (chosen on the local test split)
max_length: 57344
